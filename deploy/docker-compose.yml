# LifeData AI Copilot — full containerised stack.
#
# Superset runs from the official image plus a Postgres driver and nothing else
# (spec §0 — see deploy/superset/Dockerfile for why that one addition exists).
# Everything, including the Django orchestrator, runs in Docker.
#
#   Browser → http://localhost:8080  (nginx, the single same-origin entry point)
#     ├── /              → superset:8088
#     └── /lifedata-ai/  → django:8000
#
# Same-origin routing is load-bearing: the panel executes write actions with the
# user's own Superset session cookie + CSRF token. Do NOT browse Superset
# directly on another port — the panel is not injected there and cookies are not
# shared.

name: lifedata

services:
  postgres:
    # PostGIS, not plain Postgres: patient-origin and facility geography are
    # real spatial data, and the §6.4 geography policy (district floor for
    # patient data, no point maps) is enforced in the reporting views.
    image: postgis/postgis:16-3.5
    container_name: lifedata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifedata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifedata-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-lifedata}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Exposed so your IDE / psql / DBeaver can connect from the host.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifedata} -d ${POSTGRES_DB:-lifedata}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: lifedata-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    image: lifedata/superset:6.1.0-pg
    container_name: lifedata-superset
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required — Superset refuses to boot with a weak key}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      POSTGRES_USER: ${POSTGRES_USER:-lifedata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifedata-dev-password}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ANALYST_USERNAME: ${SUPERSET_ANALYST_USERNAME:-analyst}
      SUPERSET_ANALYST_PASSWORD: ${SUPERSET_ANALYST_PASSWORD:-analyst}
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/bootstrap.sh:/app/bootstrap.sh:ro
      - superset-home:/app/superset_home
    command: ["/bin/bash", "/app/bootstrap.sh"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 90s

  django:
    build:
      context: ..
      dockerfile: deploy/django/Dockerfile
    image: lifedata/orchestrator:dev
    container_name: lifedata-django
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: lifedata.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      # nginx forwards the browser's Host header, so localhost must be allowed.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,django}
      # Inside the network these resolve to service names, not localhost.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-lifedata}
      POSTGRES_USER: ${POSTGRES_USER:-lifedata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifedata-dev-password}
      # Server-side read tools call Superset container-to-container.
      LIFEDATA_AI_SUPERSET_INTERNAL_URL: http://superset:8088
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LIFEDATA_AI_MODEL: ${LIFEDATA_AI_MODEL:-claude-opus-5}
      LIFEDATA_AI_EFFORT: ${LIFEDATA_AI_EFFORT:-high}
      LIFEDATA_AI_MAX_TOOL_ROUNDS: ${LIFEDATA_AI_MAX_TOOL_ROUNDS:-12}
    volumes:
      # Live code reload: edit in your IDE, the dev server restarts.
      - ..:/app
      # Keep the image's virtualenv — don't let the bind mount shadow it.
      - /app/.venv
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/lifedata-ai/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: lifedata-nginx
    restart: unless-stopped
    depends_on:
      - superset
      - django
    volumes:
      - ./nginx/lifedata.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres-data:
  redis-data:
  superset-home:
