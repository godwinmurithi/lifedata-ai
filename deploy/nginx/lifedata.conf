# LifeData AI Copilot — nginx integration (spec §3).
#
# Two jobs:
#   1. Route /lifedata-ai/* to the Django orchestrator, everything else to the
#      unmodified Superset container.
#   2. Inject the panel bundle into Superset's HTML with sub_filter.
#
# Both live on ONE origin, which is what makes the identity model work: the
# panel executes write actions with the user's own Superset session cookie and
# CSRF token, and no CORS or SSO is involved.

upstream superset {
    server superset:8088;
}

upstream lifedata {
    # The orchestrator runs in the stack. Source is bind-mounted from the host,
    # so edits in your IDE still trigger the dev server's autoreload.
    server django:8000;
}

server {
    listen 80;
    server_name localhost;

    # Superset uploads and long agent turns need generous limits.
    client_max_body_size 100m;

    # Compress at the edge — upstream gzip is disabled below so sub_filter works.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # --- Orchestrator ------------------------------------------------------
    location /lifedata-ai/ {
        proxy_pass http://lifedata;
        proxy_http_version 1.1;
        # `$http_host`, NOT `$host`. `$host` drops the port, so Django computed
        # its own origin as `http://localhost` while the browser correctly sent
        # `Origin: http://localhost:8080` — and the middleware's cross-origin
        # check refused the panel's own requests with a 403.
        #
        # Verified in a real browser: every chat turn failed with "This request
        # came from another site". Nothing in the unit suite could catch it,
        # because there is no nginx in it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for SSE streaming of the agent loop (spec §5).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
    }

    # --- Superset (unchanged image) ---------------------------------------
    location / {
        proxy_pass http://superset;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # MANDATORY: without this the upstream gzips the response and sub_filter
        # silently does nothing. This is the single most common way the panel
        # injection "fails" with no error anywhere.
        proxy_set_header Accept-Encoding "";

        sub_filter '</head>'
                   '<script defer src="/lifedata-ai/static/panel/panel.js"></script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }
}
