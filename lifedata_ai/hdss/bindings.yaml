# HDSS template bindings — the scoped registry for the `hdss-site` dashboard template ONLY.
#
# The global semantics registry was removed in commit bd6e433 by explicit decision. This file does
# not bring it back for the rest of Vima: nothing outside lifedata_ai/hdss/ reads it. It exists so the
# HDSS template can refuse what it cannot show honestly:
#
#   * A dataset that is not listed here cannot back an HDSS dashboard.
#   * Every column the template touches is listed under `columns` with a role. `key` and `personal`
#     columns are never grouped, filtered or returned; dimensions may only use `dimension`/`geography`
#     columns; the time filter only a `temporal` column.
#   * A dimension, role or category that is not defined here is UNBOUND: the card is hidden with
#     "No data source registered" (no_source) or "Needs definition" (needs_definition). Nothing is
#     guessed. Code lists come from the data owner, never from the model.
#
# Edits take effect without a restart (the loader re-reads the file when its mtime changes), but they
# are reviewed like code: commit them.
#
# Category syntax, per dimension:
#   column: <col>                  categories: {Label: [raw values]}            (single column)
#   column: <numeric col>          categories: {Label: {min: 0, max: 5}}       (min inclusive, max exclusive)
#   (no column)                    categories: {Label: {<col>: [raw values]}}   (each category its own column)
#   any category may instead be    {unbound: '"<reason>"'}
# `multi: true` means one person can fall in several categories (events, assets).

version: 1

datasets:

  hdss-template-demo:
    superset_dataset_id: 251
    label: HDSS template demo (synthetic)
    grain: person
    synthetic: true
    sensitivity: aggregate_only
    min_cell_size: 0
    # The design's "today": its sparklines run Nov 2025 – Oct 2026 and "Last 3 months" counts back from here.
    reference_date: '2026-10-20'
    site: {column: hdss_site, value: HDSS template demo}
    columns:
      record_id: key
      household_id: household_key
      hdss_site: site
      district: geography
      county: geography
      subcounty: geography
      parish: geography
      village: geography
      latitude: coordinate
      longitude: coordinate
      record_date: temporal
      sex: dimension
      age_band: dimension
      education: dimension
      occupation: dimension
      marital_status: dimension
      migration_type: dimension
      event_type: dimension
      bednet: dimension
      cooking_fuel: dimension
      water_source: dimension
      roof: dimension
      floor: dimension
      toilet: dimension
      has_radio: dimension
      has_tv: dimension
      has_phone: dimension
      has_fridge: dimension
      has_vehicles: dimension
      update_cycle: dimension
    roles:
      household_id: household_id
      record_date: record_date
      latitude: latitude
      longitude: longitude
    geography: {district: district, county: county, subcounty: subcounty, parish: parish, village: village}
    dimensions:
      sex: {column: sex, categories: {Male: [Male], Female: [Female]}}
      age_band:
        column: age_band
        categories: {'65+': ['65+'], '45-64': ['45-64'], '25-44': ['25-44'], '15-24': ['15-24'], '5-14': ['5-14'], '0-4': ['0-4']}
      event:
        multi: true
        column: event_type
        categories: {Births: [Birth], Deaths: [Death], In-migration: [In-migration], Out-migration: [Out-migration]}
      education: {column: education, categories: {None: [None], Primary: [Primary], Secondary: [Secondary], Tertiary: [Tertiary]}}
      occupation:
        column: occupation
        categories: {Student: [Student], None: [None], Trader: [Trader], Farmer: [Farmer], Employed: [Employed], Homemaker: [Homemaker], Other: [Other]}
      marital:
        column: marital_status
        categories: {Single: [Single], Divorced: [Divorced], Married: [Married], Widowed: [Widowed]}
      migration:
        column: migration_type
        categories: {None: [None], In-migrant: [In-migrant], Visitor: [Visitor], Out-migrant: [Out-migrant]}
      bednet: {column: bednet, categories: {'Yes': ['Yes'], 'No': ['No']}}
      fuel: {column: cooking_fuel, categories: {Firewood: [Firewood], Charcoal: [Charcoal], Gas: [Gas], Electricity: [Electricity]}}
      water: {column: water_source, categories: {Tap: [Tap], Borehole: [Borehole], Well: [Well], Other: [Other]}}
      roof: {column: roof, categories: {Iron: [Iron], Thatched: [Thatched], Tiled: [Tiled]}}
      floor: {column: floor, categories: {Cement: [Cement], Earth: [Earth], Tiled: [Tiled]}}
      toilet:
        column: toilet
        categories: {Pit latrine: [Pit latrine], VIP latrine: [VIP latrine], Flush toilet: [Flush toilet], None: [None]}
      asset:
        multi: true
        categories:
          Radio: {has_radio: ['Yes']}
          TV: {has_tv: ['Yes']}
          Phone: {has_phone: ['Yes']}
          Fridge: {has_fridge: ['Yes']}
          Vehicles: {has_vehicles: ['Yes']}
      # Filter only (no card). Illustrative: demo records are assigned to six-monthly rounds on the SINCEP
      # calendar (Oct-Mar / Apr-Sep) from their record date; see docs/design/hdss/dataset_251_*.sql.
      update_cycle:
        column: update_cycle
        categories:
          UC09 (Oct 2025 – Mar 2026): [UC09]
          UC10 (Apr – Sep 2026): [UC10]
          UC11 (Oct 2026 – Mar 2027): [UC11]

  sincep-iganga-mayuge:
    superset_dataset_id: 252
    label: SINCEP Iganga-Mayuge HDSS
    grain: person
    synthetic: false
    sensitivity: aggregate_only
    # Real person records: counts below 5 are shown as "<5". Confirm with the data owner.
    min_cell_size: 5
    site: {column: hdss_site, value: SINCEP Iganga-Mayuge HDSS}
    columns:
      household_key: household_key
      hdss_site: site
      district: geography
      county: geography
      subcounty: geography
      parish: geography
      village: geography
      latitude: coordinate
      longitude: coordinate
      collection_date: temporal
      sex: dimension
      age_years: dimension
      age_group: dimension
      education_level: dimension
      occupation: dimension
      marital_status: dimension
      residency_status: dimension
      entry_type: dimension
      exit_type: dimension
      cooking_fuel: dimension
      water_source: dimension
      roof_material: dimension
      floor_material: dimension
      toilet_type: dimension
      owns_radio: dimension
      owns_tv: dimension
      mobile_phones_owned: dimension
      slept_under_net_last_night: dimension
      update_cycle: dimension
    roles:
      household_id: household_key
      record_date: {needs_definition: 'Which date drives the time filter (collection_date, entry_date or latest_event_date) is not decided.'}
      latitude: {needs_definition: 'All 300 records share one coordinate point; village locations need a defined source.'}
      longitude: {needs_definition: 'All 300 records share one coordinate point; village locations need a defined source.'}
    geography: {district: district, county: county, subcounty: subcounty, parish: parish, village: village}
    dimensions:
      sex: {column: sex, categories: {Male: [Male], Female: [Female]}}
      age_band:
        # Template bands; the 10-year source bands merge exactly (per the template brief).
        column: age_group
        categories: {'65+': ['65+'], '45-64': ['45-54', '55-64'], '25-44': ['25-34', '35-44'], '15-24': ['15-24'], '5-14': ['5-14'], '0-4': ['0-4']}
      event:
        multi: true
        categories:
          Births: {entry_type: [Birth]}
          Deaths: {exit_type: [Death]}
          In-migration: {entry_type: [In-migration]}
          Out-migration: {exit_type: [Out-migration]}
      # The dataset's own labels, unmerged: grouping them into the design's shorter lists is a code-list decision.
      education:
        column: education_level
        categories:
          None: [None]
          Pre-primary: [Pre-primary]
          Primary incomplete: [Primary incomplete]
          Primary complete: [Primary complete]
          Secondary incomplete: [Secondary incomplete]
          Secondary complete: [Secondary complete]
          Tertiary/vocational: [Tertiary/vocational]
          Not applicable (under 4): [Not applicable (under 4)]
      occupation:
        column: occupation
        categories:
          Farmer (subsistence): [Farmer (subsistence)]
          Farmer (family farm): [Farmer (family farm)]
          Student: [Student]
          Casual labourer: [Casual labourer]
          Trader / business: [Trader / business]
          Boda boda rider: [Boda boda rider]
          Homemaker: [Homemaker]
          Salaried employee: [Salaried employee]
          Fisher: [Fisher]
          Unemployed: [Unemployed]
          Retired / not working: [Retired / not working]
          Child (not working): [Child (not working)]
          Not applicable (child): [Not applicable (child)]
      marital:
        column: marital_status
        categories:
          Never married: [Never married]
          Married (monogamous): [Married (monogamous)]
          Married (polygamous): [Married (polygamous)]
          Cohabiting: [Cohabiting]
          Divorced/Separated: [Divorced/Separated]
          Widowed: [Widowed]
      migration: {needs_definition: 'The template''s None / In-migrant / Out-migrant / Visitor has no agreed mapping (residency_status? entry/exit type?); Visitor has no source.'}
      bednet: {needs_definition: 'Bednet use: slept_under_net_last_night (person) or bednets_owned (household) is not decided.'}
      fuel:
        column: cooking_fuel
        categories: {Firewood: [Firewood], Charcoal: [Charcoal], LPG gas: [LPG gas], Electricity: [Electricity]}
      water:
        column: water_source
        categories:
          Piped water (tap): [Piped water (tap)]
          Borehole: [Borehole]
          Protected well / spring: [Protected well / spring]
          Unprotected well / spring: [Unprotected well / spring]
          Rainwater: [Rainwater]
          Surface water (lake/river/pond): [Surface water (lake/river/pond)]
      roof:
        column: roof_material
        categories: {Iron sheets: [Iron sheets], Thatch: [Thatch], Tiles / concrete: [Tiles / concrete], Other: [Other]}
      floor:
        column: floor_material
        categories: {Cement: [Cement], Earth / mud: [Earth / mud], Tiles: [Tiles], Wood / other: [Wood / other]}
      toilet:
        column: toilet_type
        categories:
          Pit latrine without slab: [Pit latrine without slab]
          Pit latrine with slab: [Pit latrine with slab]
          VIP latrine: [VIP latrine]
          Flush toilet: [Flush toilet]
          No facility / bush: [No facility / bush]
      asset:
        multi: true
        categories:
          Radio: {owns_radio: ['Yes']}
          TV: {owns_tv: ['Yes']}
          Phone: {mobile_phones_owned: {min: 1}}
          Fridge: {unbound: 'No fridge column in this dataset.'}
          Vehicles: {unbound: 'Needs definition: which of main_means_of_transport counts as a household vehicle is not decided.'}
      # Filter only (no card): the dataset's own update cycles and their periods (update_cycle_period).
      update_cycle:
        column: update_cycle
        categories:
          UC01 (Oct 2021 – Mar 2022): [UC01]
          UC02 (Apr – Sep 2022): [UC02]
          UC03 (Oct 2022 – Mar 2023): [UC03]
          UC04 (Apr – Sep 2023): [UC04]
          UC05 (Oct 2023 – Mar 2024): [UC05]
          UC06 (Apr – Sep 2024): [UC06]
          UC07 (Oct 2024 – Mar 2025): [UC07]
          UC08 (Apr – Sep 2025): [UC08]
          UC09 (Oct 2025 – Mar 2026): [UC09]
          UC10 (Apr – Sep 2026): [UC10]

  navrongo-hdss:
    superset_dataset_id: 246
    label: Navrongo HDSS
    grain: person
    # demographics_source is 'Partly dummy' on every row; the page says "Illustrative data".
    synthetic: true
    sensitivity: aggregate_only
    min_cell_size: 0
    site: {column: hdss_site, value: Navrongo HDSS}
    columns:
      individual_id: key
      household_id: household_key
      hdss_site: site
      community: geography
      sex: dimension
      age_years: dimension
      entry_type: dimension
      exit_type: dimension
      entry_date: internal
    roles:
      household_id: household_id
      record_date: {needs_definition: 'entry_date is text here and which date drives the time filter is not decided.'}
      latitude: {needs_definition: '53 of 100 points are the HDSS site point (coordinate_source); no village locations.'}
      longitude: {needs_definition: '53 of 100 points are the HDSS site point (coordinate_source); no village locations.'}
    geography:
      district: {no_source: 'district is a dummy filler column in this file (dummy_fields).'}
      county: {no_source: 'Not in the harmonised layout.'}
      subcounty: {no_source: 'Not in the harmonised layout.'}
      parish: {no_source: 'Not in the harmonised layout.'}
      village: community
    dimensions:
      sex: {column: sex, categories: {Male: [Male], Female: [Female]}}
      age_band:
        column: age_years
        categories: {'65+': {min: 65}, '45-64': {min: 45, max: 65}, '25-44': {min: 25, max: 45}, '15-24': {min: 15, max: 25}, '5-14': {min: 5, max: 15}, '0-4': {min: 0, max: 5}}
      event:
        multi: true
        categories:
          Births: {entry_type: [Birth]}
          Deaths: {exit_type: [Death]}
          In-migration: {entry_type: [In-migration]}
          Out-migration: {exit_type: [Out-migration]}
      education: {no_source: 'education_code is a dummy filler column in this file (dummy_fields); code list also undefined.'}
      occupation: {no_source: 'occupation_code is a dummy filler column in this file (dummy_fields); code list also undefined.'}
      marital: {no_source: 'marital_status_code is a dummy filler column in this file (dummy_fields); code list also undefined.'}
      migration: {needs_definition: 'migration_type holds only "external" or blank; no mapping to None / In-migrant / Out-migrant / Visitor.'}
      bednet: {no_source: 'mosquito_net_fcorres is empty for every row.'}
      fuel: {no_source: 'stove_fuel_fcorres_* are empty for every row.'}
      water: {no_source: 'h2o_fcorres is empty for every row.'}
      roof: {no_source: 'roof_fcorres is empty for every row.'}
      floor: {no_source: 'floor_fcorres is empty for every row.'}
      toilet: {no_source: 'toilet_fcorres is empty for every row.'}
      asset: {no_source: 'radio/tv/mobile/fridge/car columns are empty for every row.'}
      update_cycle: {no_source: 'No update-cycle column in this file.'}
