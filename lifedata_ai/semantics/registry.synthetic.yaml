# LifeData semantics registry (spec §8).
#
# This file is read by BOTH the prompt assembler (interpretation) and the
# validator (enforcement). That is deliberate: what the model is told and what
# the system permits come from one source, so they cannot drift apart.
#
# ---------------------------------------------------------------------------
# THIS FILE IS THE ONLY PLACE SQL IS AUTHORED IN THE WHOLE SYSTEM.
#
# The `metrics:` blocks below carry SQL expressions. That is not a hole in the
# no-SQL rule — it is what makes the rule affordable. The rule is that *the
# model* never writes SQL and that no SQL is composed at request time. These
# expressions are written by a human, reviewed in this file like code, and
# applied to Superset by an administrator running
#
#     manage.py register_superset_datasets --sync-metadata
#
# after which they exist as Superset *saved metrics*. The copilot then refers to
# one by name — `"metrics": ["malaria_positivity"]` — which passes through
# `_to_superset_metric`'s first branch untouched and clears validation as an
# ordinary identifier. The model never sees an expression and could not emit one
# if it wanted to: `_SIMPLE_AGGREGATION` in validation/schemas/actions.py has no
# key an expression could occupy.
#
# Saved metrics are not a convenience here, they are mandatory. Three of the six
# governed indicators are structurally unrepresentable as {aggregate, column}:
# `confirmed_diagnoses` is a COUNT(*) FILTER, and `malaria_positivity` and
# `lab_completion_rate` are ratios. Without saved metrics the copilot simply
# cannot chart them, and that unrepresentability is a security property that must
# not be weakened to work around it.
# ---------------------------------------------------------------------------
#
# Review it like code. Dataset IDs are the live IDs in this Superset instance —
# regenerate with `manage.py register_superset_datasets` after a reset.
#
# Column `role` values, which the validator enforces as an ALLOWLIST:
#   dimension      — may be a groupby or an x_axis. Shown in the catalogue.
#   temporal       — a date/period column; may be an x_axis or a time column.
#   measure_source — numeric, aggregated over; never a grouping.
#   key            — an internal identifier. NEVER groupable.
#   internal       — a derived helper column users should not see or chart.
#   map_key        — a boundary join code. Groupable ONLY as a choropleth's
#                    `entity`; never a bar chart's axis, never shown to a user.
#
# Only `dimension` and `temporal` columns may be grouped by. A column this file
# does not declare at all is refused too — a new view column cannot silently
# become groupable.

datasets:
  - name: rpt_facilities
    label: "Health facilities"
    superset_dataset_id: 1
    grain: facility
    one_row_is: "one health facility"
    subject_areas: [facilities, geography, coverage]
    synonyms: [facility, facilities, clinic, clinics, hospital, hospitals,
               health centre, sites, coverage, where are]
    sensitivity: aggregate_ok
    geography: facility
    default_dimension: district_name
    notes: >-
      One row per health facility. Facilities are institutions, not people, so
      exact coordinates and point maps are permitted here.
    columns:
      - {name: facility_id, role: key}
      - {name: facility_name, label: "Facility", role: dimension,
         note: "The facility's own name, e.g. Kampala HC IV"}
      - {name: facility_level, label: "Facility level", role: dimension,
         note: "HC II / HC III / HC IV / Hospital — the size and tier of the facility"}
      - {name: district_name, label: "District", role: dimension}
      - {name: district_iso, role: map_key,
         note: "Boundary code for the Uganda map. Never shown to the user."}
      - {name: region, label: "Region", role: dimension}
      - {name: latitude, role: measure_source}
      - {name: longitude, role: measure_source}
    metrics:
      - {name: facilities, label: "Facilities", expression: "COUNT(*)", d3format: ",d"}

  - name: rpt_encounters
    label: "Patient encounters"
    superset_dataset_id: 2
    grain: encounter
    one_row_is: "one ENCOUNTER (a visit), not one patient"
    subject_areas: [encounters, facilities, utilisation, diagnoses]
    synonyms: [encounter, encounters, visit, visits, patients, people, caseload,
               attendance, utilisation, utilization, diagnosis, diagnoses,
               consultations, activity, workload]
    sensitivity: aggregate_ok
    geography: facility
    status_field: diagnosis_certainty   # suspected | confirmed
    time_column: encounter_date
    default_dimension: facility_name
    default_time_range: "Last 12 months"
    notes: >-
      One row per encounter. A patient appears once per visit, so counting rows
      counts visits and counting people needs the unique_patients metric — a
      plain row count is encounters, not patients. Diagnosis certainty separates
      suspected from confirmed; never present a suspected diagnosis as
      confirmed.
    columns:
      - {name: encounter_id, role: key}
      - {name: encounter_date, label: "Encounter date", role: temporal}
      - {name: encounter_month, role: internal,
         note: "Pre-truncated month. Use time_grain_sqla on encounter_date instead."}
      - {name: encounter_type, label: "Encounter type", role: dimension}
      - {name: completed, label: "Completed", role: dimension}
      - {name: diagnosis, label: "Diagnosis", role: dimension}
      - {name: diagnosis_certainty, label: "Diagnosis certainty", role: dimension,
         note: "suspected or confirmed — never present a suspected diagnosis as confirmed"}
      - {name: facility_id, role: key}
      - {name: facility_name, label: "Facility", role: dimension,
         note: "The facility's own name, e.g. Kampala HC IV"}
      - {name: facility_level, label: "Facility level", role: dimension,
         note: "HC II / HC III / HC IV / Hospital"}
      - {name: district_name, label: "District", role: dimension}
      - {name: district_iso, role: map_key,
         note: "Boundary code for the Uganda map. Never shown to the user."}
      - {name: region, label: "Region", role: dimension}
      - {name: patient_id, role: key,
         note: "Identifies a person. Countable with COUNT_DISTINCT, never groupable."}
      - {name: sex, label: "Sex", role: dimension}
      - {name: age_years, label: "Age (years)", role: measure_source}
    metrics:
      - {name: encounters, label: "Encounters", expression: "COUNT(*)", d3format: ",d",
         indicator: encounter_volume}
      - {name: unique_patients, label: "Unique patients",
         expression: "COUNT(DISTINCT patient_id)", d3format: ",d",
         indicator: unique_patients}
      - name: confirmed_diagnoses
        label: "Confirmed diagnoses"
        expression: "COUNT(*) FILTER (WHERE diagnosis_certainty = 'confirmed')"
        d3format: ",d"
        indicator: confirmed_diagnoses
      - {name: mean_age_years, label: "Average age (years)",
         expression: "AVG(age_years)", d3format: ".1f"}

  - name: rpt_lab_orders
    label: "Laboratory orders"
    superset_dataset_id: 3
    grain: lab_order
    one_row_is: "one laboratory ORDER, not a completed test"
    subject_areas: [laboratory, turnaround, testing]
    synonyms: [lab, labs, laboratory, test, tests, testing, samples, specimen,
               turnaround, results, malaria, malaria test, positivity,
               diagnostics, backlog, order, orders, lab order, lab orders,
               verified, slowest, fastest]
    sensitivity: aggregate_ok
    geography: facility
    status_field: order_status  # ordered|collected|resulted|verified|cancelled|rejected
    time_column: ordered_at
    default_dimension: facility_name
    default_time_range: "Last 12 months"
    notes: >-
      One row per laboratory ORDER, not per completed test. Turnaround is only
      recorded once an order has been verified, so averages over it describe
      completed work only. Never treat an order as a result.
    traps: >-
      Turnaround is only recorded once an order has been verified, so any
      average turnaround describes completed work only and says nothing about a
      growing backlog. An order is not a result: an order that has not been
      verified carries no result at all.
    columns:
      - {name: lab_order_id, role: key}
      - {name: test_type, label: "Test", role: dimension,
         note: "Which test was ordered, e.g. malaria_rdt"}
      - {name: order_status, label: "Order status", role: dimension,
         note: "ordered / collected / resulted / verified / cancelled / rejected"}
      - {name: ordered_at, label: "Ordered at", role: temporal}
      - {name: ordered_month, role: internal,
         note: "Pre-truncated month. Use time_grain_sqla on ordered_at instead."}
      - {name: verified_at, label: "Verified at", role: temporal}
      - {name: turnaround_hours, label: "Turnaround (hours)", role: measure_source,
         note: "NULL unless the order was verified, so averages cover completed work only"}
      - {name: result_value, label: "Result", role: dimension,
         note: "positive / negative / inconclusive, where a result exists"}
      - {name: facility_id, role: key}
      - {name: facility_name, label: "Facility", role: dimension,
         note: "The facility's own name, e.g. Kampala HC IV"}
      - {name: facility_level, label: "Facility level", role: dimension,
         note: "HC II / HC III / HC IV / Hospital"}
      - {name: district_name, label: "District", role: dimension}
      - {name: district_iso, role: map_key,
         note: "Boundary code for the Uganda map. Never shown to the user."}
      - {name: region, label: "Region", role: dimension}
    metrics:
      - {name: orders, label: "Orders", expression: "COUNT(*)", d3format: ",d"}
      - name: malaria_positivity
        label: "Malaria positivity"
        expression: >-
          COUNT(*) FILTER (WHERE test_type = 'malaria_rdt'
            AND result_value = 'positive' AND order_status = 'verified')::numeric
          / NULLIF(COUNT(*) FILTER (WHERE test_type = 'malaria_rdt'
            AND order_status = 'verified'), 0)
        d3format: ".1%"
        indicator: malaria_positivity
      - name: lab_completion_rate
        label: "Lab completion rate"
        expression: >-
          COUNT(*) FILTER (WHERE order_status = 'verified')::numeric
          / NULLIF(COUNT(*) FILTER (WHERE order_status <> 'cancelled'), 0)
        d3format: ".1%"
        indicator: lab_completion_rate
      - {name: avg_turnaround_hours, label: "Average turnaround (hours)",
         expression: "AVG(turnaround_hours)", d3format: ".1f",
         indicator: lab_turnaround_hours}

  - name: rpt_patient_geography
    label: "Where patients come from"
    superset_dataset_id: 4
    grain: district
    one_row_is: "one DISTRICT, already aggregated"
    subject_areas: [geography, demographics, catchment]
    synonyms: [geography, district, districts, region, regions, catchment,
               come from, coverage, demographics, origin, live, living,
               patient geography, patient origin, reach]
    sensitivity: aggregate_only
    geography: patient          # triggers district-floor + no-point-maps policy
    small_cell_threshold: 5
    default_dimension: district_name
    notes: >-
      Patient counts aggregated to DISTRICT, with districts under 5 patients
      suppressed in the view itself. There is no patient identifier and no point
      geometry in this dataset, so sub-district grouping and point/scatter/heat
      maps are impossible by construction, not merely disallowed.
    traps: >-
      Already aggregated to district. A district missing from a chart may have
      been suppressed for having fewer than 5 patients, not for having none.
    columns:
      - {name: district_name, label: "District", role: dimension}
      - {name: district_iso, role: map_key,
         note: "Boundary code for the Uganda map. Never shown to the user."}
      - {name: region, label: "Region", role: dimension}
      - {name: patient_count, label: "Patients", role: measure_source}
      - {name: female_count, label: "Female patients", role: measure_source}
      - {name: male_count, label: "Male patients", role: measure_source}
      - {name: mean_age_years, label: "Average age (years)", role: measure_source}
      - {name: district_centroid_latitude, role: measure_source}
      - {name: district_centroid_longitude, role: measure_source}
    metrics:
      - {name: patients, label: "Patients", expression: "SUM(patient_count)", d3format: ",d"}
      - {name: districts, label: "Districts", expression: "COUNT(*)", d3format: ",d"}

  - name: rpt_diabetes_screening
    label: "Diabetes screening"
    superset_dataset_id: 5
    grain: form_submission
    one_row_is: "one screening SUBMISSION — a screening finding, never a diagnosis"
    subject_areas: [screening, forms, diabetes]
    synonyms: [screening, screened, diabetes, glucose, bmi, risk band,
               form, forms, submissions]
    sensitivity: aggregate_ok
    geography: facility
    form_key: diabetes_screening
    time_column: submitted_on
    default_dimension: facility_name
    default_time_range: "Last 12 months"
    notes: >-
      One row per diabetes screening submission. A screening result is NOT a
      diagnosis; describe these as screening findings, never as diabetes
      prevalence.
    traps: >-
      A screening result is not a diagnosis. Describe these as screening
      findings, never as prevalence or caseload.
    columns:
      - {name: submission_id, role: key}
      - {name: submitted_on, label: "Submitted on", role: temporal}
      - {name: submitted_month, role: internal,
         note: "Pre-truncated month. Use time_grain_sqla on submitted_on instead."}
      - {name: facility_id, role: key}
      - {name: facility_name, label: "Facility", role: dimension}
      - {name: district_name, label: "District", role: dimension}
      - {name: district_iso, role: map_key,
         note: "Boundary code for the Uganda map. Never shown to the user."}
      - {name: region, label: "Region", role: dimension}
      - {name: risk_band, label: "Risk band", role: dimension,
         note: "The screening tool's own banding — a finding, not a diagnosis"}
      - {name: family_history, label: "Family history", role: dimension}
      - {name: fasting_glucose_mmol_l, label: "Fasting glucose (mmol/L)",
         role: measure_source}
      - {name: bmi, label: "BMI", role: measure_source}
      - {name: age_years, label: "Age (years)", role: measure_source}
    metrics:
      - {name: screenings, label: "Screenings", expression: "COUNT(*)", d3format: ",d"}
      - {name: mean_fasting_glucose, label: "Average fasting glucose (mmol/L)",
         expression: "AVG(fasting_glucose_mmol_l)", d3format: ".1f"}
      - {name: mean_bmi, label: "Average BMI", expression: "AVG(bmi)", d3format: ".1f"}

# ---------------------------------------------------------------------------
# Governed indicator definitions. `explain_indicator` returns these verbatim —
# the model does not paraphrase them.
#
# A metric above may carry `indicator: <name>` to back-link to one of these.
# That link is what keeps the definition the copilot *quotes* and the definition
# the chart on screen actually *computes* the same thing.
# ---------------------------------------------------------------------------
indicators:
  - name: malaria_positivity
    dataset: rpt_lab_orders
    definition: >-
      Positive completed malaria tests divided by eligible completed malaria
      tests.
    numerator: "test_type = 'malaria_rdt' AND result_value = 'positive' AND order_status = 'verified'"
    denominator: "test_type = 'malaria_rdt' AND order_status = 'verified'"
    unit: percent
    counts: tests               # NOT unique patients
    caveats: >-
      Excludes cancelled and rejected orders. Counts tests, not patients — one
      patient may be tested repeatedly. Positivity reflects who was tested, not
      population prevalence.

  - name: unique_patients
    dataset: rpt_encounters
    definition: "Distinct patients with at least one encounter in the period."
    expression: "COUNT(DISTINCT patient_id)"
    unit: count
    counts: patients
    caveats: >-
      Distinct from encounter volume. A rise in encounters with flat unique
      patients means more visits per patient, not more people reached.

  - name: encounter_volume
    dataset: rpt_encounters
    definition: "Total encounters recorded in the period."
    expression: "COUNT(*)"
    unit: count
    counts: encounters
    caveats: "Counts visits, not people. Use unique_patients for population reach."

  - name: lab_turnaround_hours
    dataset: rpt_lab_orders
    definition: "Hours from order to verification, for verified orders only."
    expression: "AVG(turnaround_hours)"
    unit: hours
    counts: tests
    caveats: >-
      Valid only where verified_at is set. Orders still in progress are excluded
      entirely, so this understates delay if a backlog is growing.

  - name: lab_completion_rate
    dataset: rpt_lab_orders
    definition: "Verified orders divided by all orders placed, excluding cancelled."
    numerator: "order_status = 'verified'"
    denominator: "order_status <> 'cancelled'"
    unit: percent
    counts: tests

  - name: confirmed_diagnoses
    dataset: rpt_encounters
    definition: "Encounters with a confirmed (not suspected) diagnosis."
    expression: "COUNT(*) FILTER (WHERE diagnosis_certainty = 'confirmed')"
    unit: count
    counts: encounters
    caveats: "Never include suspected diagnoses in this figure."

# ---------------------------------------------------------------------------
# Allowlists. The validator rejects anything not named here (spec §6).
# ---------------------------------------------------------------------------
# Only viz types this Superset build actually registers. `bar` was in this list
# and is NOT a registered plugin in Superset 6.1.0: every chart the copilot
# built with it rendered "Item with key \"bar\" is not registered" on the
# dashboard. Superset's categorical bar chart is echarts_timeseries_bar, which
# handles a non-time x-axis perfectly well.
#
# Deliberately short. Every entry here has been built and seen to render; a viz
# type nobody has verified is a chart the executive gets to discover is broken.
# `deck_polygon` and `histogram_v2` were dropped, and both for the same reason:
# neither had been verified to render on this data.
#
# `deck_polygon` needs POLYGON geometry and rpt_patient_geography carries
# district CENTROIDS — which are points. A choropleth is therefore probably not
# renderable here at all, and sourcing district boundaries is a GIS task, not a
# copilot task. A bar chart or a table of districts answers the actual question.
# `histogram_v2` was never verified against 6.1.0 and no executive asks for a
# histogram.
#
# Five verified types is a feature, not a compromise: Superset accepts almost
# anything and only the browser reveals the truth — a chart saved with an
# unregistered viz type returns 2xx and then renders "Item with key ... is not
# registered" on the dashboard, where an executive finds it and the copilot
# never learns.
#
# ADDING ONE IS NOT A CONFIG CHANGE. Build a chart of that type from what the
# pipeline actually writes, open it, and look — then add a case to
# tests_browser/test_viz_renders.py, which fails if an entry here has none.
# Control names differ per plugin and a name nobody set is ignored in silence:
# `big_number_total` and `pie` read `metric`, the rest read `metrics`, and the
# three KPI tiles that got this wrong read "No data" through a 13/13 green
# acceptance run. See docs/runbook.md §16.
viz_allowlist:
  - big_number_total
  - country_map
  - echarts_timeseries_line
  - echarts_timeseries_bar
  - pie
  - table

#: Viz types that are never permitted on a dataset with geography: patient.
patient_geography_forbidden_viz:
  - deck_scatter
  - deck_heatmap
  - deck_hex
  - deck_geojson
  - deck_path
  - mapbox

# Superset's own built-in categorical palettes. A consistent `color_scheme` per
# chart delivers the visual coherence an executive notices, and it costs nothing
# — unlike the dashboard "themes" below, which corresponded to nothing.
#
# Allowlisted rather than free text for the same reason every other name here is:
# an unvetted scheme silently falls back to Superset's default, so the chart
# renders in the wrong palette and nobody is told. Verified present in 6.1.0.
color_schemes:
  - supersetColors
  - d3Category10
  - googleCategory10c
  - lyftColors
  - bnbColors
  - echarts4Colors

# `themes:` is gone, along with `apply_dashboard_theme`. The tool wrote
# `json_metadata["theme"]`, but Superset 6 exposes theme *objects* at
# /api/v1/theme/ and nothing ever created these three ids — so they corresponded
# to nothing and the tool was almost certainly a silent no-op. A consistent
# `color_scheme` per chart delivers the coherence an executive notices, for free.
#
# Removing the section also removes the validator's `theme_allowlist` rule and
# `THEME_IDS` from the action schemas. A validator rule that can never fire is
# misdirection for the next reader, so it goes in the same commit.

# Declared but deliberately unused: the copilot builds dashboards free-form,
# guided by the layout policy in the system prompt and checked afterwards by
# `review_dashboard_design`. Recipes were considered and rejected — they make the
# common case rigid without making the uncommon case possible. Kept because the
# action schema's `layout_preset` enum reads from it, and an empty enum matches
# nothing.
layout_presets:
  - id: executive_overview
    description: KPI row → trends → breakdowns → map/detail
  - id: laboratory_performance
    description: Volume and completion KPIs → turnaround trend → per-facility comparison
