  - name: scd_screening_v2
    label: "SCD screening (outreach + newborn)"
    superset_dataset_id: 21
    grain: screening_record
    one_row_is: "one sickle cell screening test result, outreach or newborn"
    subject_areas: [sickle cell, screening, scd, health]
    synonyms: [sickle cell screening, scd screening, screening results, outreach screening, newborn screening]
    sensitivity: row_level_health_staging_rls_protected
    geography: patient
    default_dimension: district
    notes: >-
      Row-level individual screening results (RHIF outreach + newborn screening),
      staging-only (db-staging4cti), real historical health data not synthetic.
      RLS filters are configured on this dataset by birth_district (Phase 1) --
      groupby/filter results depend on the calling user's role.
    traps: >-
      is_referred is derived from referral_facility being non-null, not a
      separate clinical judgement field. tribe_bucketed collapses to "Other"
      outside the top 5 tribes by volume -- do not treat as the full tribe list.
    columns:
      - {name: source, role: dimension}
      - {name: id, role: key}
      - {name: collection_date, role: temporal}
      - {name: collection_month, role: temporal}
      - {name: gender, role: dimension}
      - {name: age_years, role: measure_source}
      - {name: age_band, role: dimension}
      - {name: testing_location, role: dimension}
      - {name: tribe, role: dimension}
      - {name: tribe_bucketed, role: dimension}
      - {name: district, label: "District of birth", role: dimension}
      - {name: results_raw, role: dimension}
      - {name: result_category, role: dimension}
      - {name: disease_subtype, role: dimension}
      - {name: prior_indicator_raw, role: dimension}
      - {name: referral_facility, role: dimension}
      - {name: is_referred, role: dimension}
      - {name: lat, role: measure_source}
      - {name: lon, role: measure_source}
      - {name: geo_precision, role: dimension}
    metrics:
      - {name: scd_screening_count, label: "Screenings", expression: "COUNT(*)", d3format: ",d"}
      - {name: scd_referred_count, label: "Referred", expression: "SUM(CASE WHEN is_referred THEN 1 ELSE 0 END)", d3format: ",d"}

  - name: scd_referral_cascade
    label: "SCD referral cascade"
    superset_dataset_id: 22
    grain: funnel_stage
    one_row_is: "one stage of the screening-to-referral funnel, already aggregated"
    subject_areas: [sickle cell, referral, funnel, screening]
    synonyms: [referral cascade, referral funnel, screening funnel, cascade]
    sensitivity: aggregate_ok
    geography: none
    default_dimension: stage_name
    notes: >-
      Pre-aggregated funnel: one row per stage with a count and a percent of
      the initial screened population. No patient identifier, no facility
      grain -- cannot be broken down further than it already is.
    columns:
      - {name: stage_order, role: dimension}
      - {name: n, role: measure_source}
      - {name: stage_name, role: dimension}
      - {name: pct_of_screened, role: measure_source}
      - {name: stage_label, role: dimension}
    metrics:
      - {name: cascade_n, label: "Count", expression: "SUM(n)", d3format: ",d"}


