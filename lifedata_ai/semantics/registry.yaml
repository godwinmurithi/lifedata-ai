    subject_areas: [disease, morbidity, breakdown, trans nzoia]
    synonyms: [disease, diseases, morbidity, breakdown, burden, cases,
               conditions, trans nzoia disease]
    sensitivity: aggregate_only
    geography: none
    default_dimension: disease
    notes: >-
      Already aggregated. One row per disease within a category, carrying a
      single value.
    traps: >-
      `value` is a reported count, not a rate and not a prevalence. Never
      present it as a proportion of the population.
    columns:
      - {name: category, label: "Category", role: dimension}
      - {name: disease, label: "Disease", role: dimension}
      - {name: value, label: "Reported cases", role: measure_source}
    metrics:
      - {name: trans_nzoia_reported_cases, label: "Reported cases", expression: "SUM(value)",
         d3format: ",d", indicator: reported_cases_trans_nzoia}

