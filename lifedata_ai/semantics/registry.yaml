# stated here. The clinical and programmatic indicators this deployment will
# eventually want — service-availability rates, staffing ratios, catchment
# coverage — depend on how each survey encodes its answers, and inventing a
# definition is exactly the failure this file exists to prevent. A domain owner
# should author them, in this file, reviewed like code.

