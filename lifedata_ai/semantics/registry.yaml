# ---------------------------------------------------------------------------
indicators:
  - name: facility_count_buikwe
    dataset: buikwe_level1_facilities
    definition: "The number of health facilities surveyed in Buikwe district."
    expression: "COUNT(*)"
    unit: count
    counts: facilities
    caveats: >-
      Counts facilities as surveyed, not as licensed or as currently open. A
      facility missing from a survey is absent from this count without being
      absent from the district.

  - name: facility_count_trans_nzoia
    dataset: trans_nzoia_level_one_facilities
    definition: "The number of health facilities recorded in Trans Nzoia."
    expression: "COUNT(*)"
    unit: count
    counts: facilities
    caveats: >-
      Counts facilities as surveyed, not as licensed or as currently open. A
      facility missing from a survey is absent from this count without being
      absent from the district.

  - name: facility_count_census
    dataset: hf_census_layer_hf_census
    definition: "The number of health facilities recorded in the facility census."
    expression: "COUNT(*)"
    unit: count
    counts: facilities
    caveats: >-
      Counts facilities as surveyed, not as licensed or as currently open. A
      facility missing from a survey is absent from this count without being
      absent from the district.

  - name: reported_cases_buikwe
    dataset: buikwe_hf_disease_breakdown
    definition: "The sum of reported case values for the selected diseases in Buikwe."
    expression: "SUM(value)"
    unit: count
    counts: reported cases
    caveats: >-
      A reported count, dependent on reporting completeness. It is not a rate,
      not a prevalence, and not comparable between areas of different
      population without a denominator this data does not carry.

  - name: reported_cases_trans_nzoia
    dataset: trans_nzoia_disease_breakdown
    definition: "The sum of reported case values for the selected diseases in Trans Nzoia."
    expression: "SUM(value)"
    unit: count
    counts: reported cases
    caveats: >-
      A reported count, dependent on reporting completeness. It is not a rate,
      not a prevalence, and not comparable between areas of different
      population without a denominator this data does not carry.

# ---------------------------------------------------------------------------
# Allowlists. The validator rejects anything not named here (spec §6).
# ---------------------------------------------------------------------------
# `country_map` is NOT here, and its absence is deliberate. It renders by
# joining on an ISO 3166-2 region code; these datasets carry `district`,
# `county` and `subcounty` as free text with no verified boundary key, so a
# country_map built on them renders blank while returning 2xx — the exact
# failure mode the allowlist doctrine exists to prevent. Add it only once a
# join key is confirmed AND a chart has been built and looked at.
#
# ADDING ONE IS NOT A CONFIG CHANGE: build a chart of that type from what the
# pipeline actually writes, open it, and look. See docs/runbook.md §16.
#
# `deck_polygon` added 2026-09-25 -- NOT joined on an ISO code like
# country_map above; it draws buikwe_subcounties_map's own GeoJSON geometry
# directly (see tools/superset_write.py's _apply_deck_polygon and that
# dataset's registry entry), so the country_map join-key problem does not
# apply to it. Built and opened in a real browser via Playwright before this
# line was added -- see AI_NATIVE_STATUS.md for what was actually checked.
viz_allowlist:
  - big_number_total
  - echarts_timeseries_line
  - echarts_timeseries_bar
  - pie
  - table
  - deck_polygon
  # Phase 7 (2026-09-26): built, rendered via playwright, and looked at
  # before adding, per the doctrine above. box_plot needed zero code changes
  # (matches the generic metrics+groupby path); funnel needed one line
  # (added to _SINGLE_METRIC_VIZ in superset_write.py); histogram_v2 needed
  # a small new adapter (_apply_histogram) since its shape is a bare
  # `column` to bucket, not metrics/groupby at all. Verified: chart 348
  # (box_plot, beds by subcounty on buikwe_level1_facilities), 349 (funnel,
  # scd_referral_cascade stages), 350 (histogram_v2, beds distribution) --
  # all three rendered real, non-trivial PNGs (16KB/39KB/10KB) via the real
  # thumbnail task, not just a successful API response.
  - box_plot
  - funnel
  - histogram_v2

patient_geography_forbidden_viz:
  - deck_scatter
  - deck_heatmap
  - deck_hex
  - deck_geojson
  - deck_path
  - mapbox

# Superset built-ins, verified present in 6.1.0. The `lifedata` brand palette
# defined in the production superset_config.py is NOT listed: it is registered
# through EXTRA_CATEGORICAL_COLOR_SCHEMES, and this staging instance carries
# different branding. Add it once confirmed present on the instance being
# deployed to, or a chart silently falls back to Superset's default.
color_schemes:
  - supersetColors
  - d3Category10
  - googleCategory10c
  - lyftColors
  - bnbColors
  - echarts4Colors

layout_presets:
  - id: executive_overview
    description: KPI row → trends → breakdowns → detail
  - id: facility_infrastructure
    description: Facility and bed KPIs → service availability → per-area comparison
