<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vima demo: spec-driven dashboards</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ef;--card:#ffffff;--ink:#141413;--ink2:#52514e;--mute:#898781;--line:#e6e4dd;--line2:#d6d4cc;--grid:#efeee9;--acc:#2a78d6;--accbg:#e8f1fc;--acctx:#185fa5;--hover:#f3f2ee;--good:#0c8a3e;--bad:#c93b3b;--tipbg:#141413;--tiptx:#fff;--mapbg:#e9e9e6}
[data-mode=dark]{--bg:#121211;--card:#1c1c1b;--ink:#f0efec;--ink2:#c3c2b7;--mute:#8d8c86;--line:#2c2c2a;--line2:#3a3a37;--grid:#2a2a28;--accbg:#13263f;--acctx:#85b7eb;--hover:#262624;--good:#4cc27a;--bad:#ef7a7a;--tipbg:#f0efec;--tiptx:#141413;--mapbg:#2a2a28}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
@media (max-width:820px){#shell{display:block;height:auto}#vima.dock{position:fixed;inset:auto 0 0 0;width:auto;height:70vh;border-radius:14px 14px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25)}}
body{background:var(--bg);color:var(--ink);font:13px/1.4 Inter,system-ui,sans-serif;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:40}
.r1{display:flex;align-items:center;gap:10px;padding:8px 16px}
.logo{display:flex;align-items:center;gap:7px;font-weight:600;font-size:15px}
.logo i{width:20px;height:20px;border-radius:6px;background:var(--ink);position:relative}
.logo i:after{content:"";position:absolute;inset:5px;border-radius:50%;border:2px solid var(--card);border-right-color:transparent}
select.dash{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:5px 8px;font-weight:500}
.ask{flex:1;max-width:620px;margin-left:auto;display:flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:999px;padding:3px 3px 3px 12px;background:var(--bg)}
.ask input{flex:1;border:0;background:transparent;outline:0;font-size:13px;min-width:0}
.ask button{border:0;background:var(--ink);color:var(--card);border-radius:999px;padding:6px 14px;font-size:12px;cursor:pointer;font-weight:500}
.ghost{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.ghost:hover{border-color:var(--mute)}
.ghost.icon{width:30px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.ghost.icon svg{width:16px;height:16px}
[data-mode=dark] .mapwrap image{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
[data-mode=dark] .attr{background:rgba(0,0,0,.55);color:#bbb}
.r2{display:flex;align-items:center;gap:6px;padding:6px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.dd{position:relative}
.dd>button{display:flex;align-items:center;gap:5px;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
.dd>button .v{color:var(--ink2);max-width:140px;overflow:hidden;text-overflow:ellipsis}
.dd>button.on{border-color:var(--acc);background:var(--accbg)}.dd>button.on .v{color:var(--acctx);font-weight:500}
.dd>button svg{width:11px;height:11px;opacity:.6}
.panel{position:absolute;top:calc(100% + 6px);left:0;z-index:60;width:250px;background:var(--card);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;display:none}
.dd.open .panel{display:block}
.panel input[type=search]{width:100%;border:1px solid var(--line2);border-radius:7px;padding:5px 8px;margin-bottom:6px;outline:0;background:var(--card)}
.opts{max-height:250px;overflow:auto}
.opt{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer}
.opt:hover{background:var(--hover)}.opt .n{margin-left:auto;color:var(--mute);font-size:11px}
.opt input{accent-color:var(--acc);margin:0}
.pfoot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:4px}
.pfoot button{border:0;background:none;color:var(--acc);font-size:12px;cursor:pointer;padding:4px}
.hint{font-size:11px;color:var(--mute);padding:2px 6px 4px}
.meta{margin-left:auto;font-size:11px;color:var(--mute)}
.status{display:none;align-items:center;gap:10px;padding:6px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2);background:var(--bg)}
.status.show{display:flex}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.status.err{color:var(--bad)}.status.ok .dot{animation:none;background:var(--good)}.status.err .dot{animation:none;background:var(--bad)}
#shell{display:flex;height:100vh}#app{flex:1;min-width:0;display:flex;flex-direction:column}
#vima{display:none;flex-direction:column;background:var(--card);border-left:1px solid var(--line);z-index:70}
#vima.open{display:flex}
#vima.dock{width:340px;flex:0 0 340px}
#vima.float{position:fixed;right:18px;bottom:18px;width:360px;height:min(580px,80vh);border:1px solid var(--line2);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.25);overflow:hidden}
.vh{display:flex;align-items:center;gap:6px;padding:9px 10px 9px 14px;border-bottom:1px solid var(--line)}
.vt{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}.vs{font-size:11px;color:var(--mute);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:92%;padding:7px 10px;border-radius:10px;font-size:12.5px;line-height:1.45}
.m.u{align-self:flex-end;background:var(--ink);color:var(--card);border-bottom-right-radius:3px}
.m.a{align-self:flex-start;background:var(--hover);color:var(--ink);border-bottom-left-radius:3px}
.m.a.err{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.m.a.info{background:transparent;border:1px dashed var(--line2);color:var(--ink2)}
.m .tag{font-size:10px;color:var(--mute);margin-top:3px;font-family:ui-monospace,Menlo,monospace}
.m.think{display:flex;gap:7px;align-items:center;color:var(--ink2)}
.m.think i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:p 1s infinite}
@keyframes p{50%{opacity:.25}}
.scope{display:none;margin:0 14px 6px;padding:5px 8px;border-radius:8px;background:var(--accbg);color:var(--acctx);font-size:12px;align-items:center;gap:6px}
.scope.on{display:flex}.scope button{margin-left:auto;border:0;background:none;color:inherit;cursor:pointer;font-size:13px}
.sugg{padding:2px 14px 8px}.sl{font-size:11px;color:var(--mute);margin:2px 0 5px}
#chips{display:flex;flex-wrap:wrap;gap:5px}
#chips button{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--ink2);cursor:pointer;text-align:left}
#chips button:hover{border-color:var(--acc);color:var(--acctx)}
.vin{border-top:1px solid var(--line);padding:8px 10px 10px}
.vin textarea{width:100%;resize:none;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;background:var(--bg);outline:0;font-size:13px}
.vin textarea:focus{border-color:var(--acc)}
.vrow{display:flex;align-items:center;gap:6px;margin-top:6px}.hint2{font-size:10.5px;color:var(--mute);flex:1}
.send{border:0;background:var(--ink);color:var(--card);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer}
.send:disabled{opacity:.5}
#launcher{position:fixed;right:18px;bottom:18px;z-index:65;display:none;align-items:center;gap:7px;border:0;border-radius:999px;padding:10px 16px;background:var(--ink);color:var(--card);font-weight:500;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#launcher.on{display:flex}
.vbtn{display:inline-flex;align-items:center;gap:5px}.vbtn.on{border-color:var(--acc);color:var(--acctx);background:var(--accbg)}
.askw{border:0;background:transparent;color:var(--mute);cursor:pointer;padding:0 2px;line-height:1;display:inline-flex;opacity:.55}
.askw:hover,.card.scoped .askw{color:var(--acc);opacity:1}
.card.scoped{box-shadow:0 0 0 2px var(--acc)}
main{display:grid;gap:8px;padding:8px 16px 10px;position:relative}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;transition:box-shadow .3s}
.card.flash{box-shadow:0 0 0 2px var(--acc)}
.card .hd{display:flex;align-items:baseline;gap:6px;flex:0 0 auto}
.card h3{margin:0;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .wid{margin-left:auto;font-size:10px;color:var(--mute);font-family:ui-monospace,Menlo,monospace;flex:0 0 auto}
.body{flex:1 1 auto;min-height:0;position:relative}
.pane{position:absolute;inset:0;visibility:hidden}.pane.on{visibility:visible}
.tabs{flex:0 0 auto;display:flex;gap:3px;margin-top:5px;padding-top:5px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs.more-r{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.tabs.more-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 15%);mask-image:linear-gradient(90deg,transparent,#000 15%)}
.tabs.more-l.more-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.tabs button{flex:0 0 auto;max-width:150px;border:0;background:transparent;color:var(--mute);font-size:11px;padding:3px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button:hover{background:var(--hover);color:var(--ink2)}
.tabs button.on{background:var(--accbg);color:var(--acctx);font-weight:500}
.kpi{justify-content:space-between}
.kpi .lab{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .row{display:flex;align-items:flex-end;gap:8px}
.kpi .val{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.kpi .d{font-size:11px;font-weight:500;white-space:nowrap}
.kpi .d.up{color:var(--good)}.kpi .d.down{color:var(--bad)}.kpi .d.flat{color:var(--mute)}
.kpi .spark{flex:1;height:30px;min-width:40px}
.mapwrap{position:absolute;inset:0;border-radius:7px;overflow:hidden;background:var(--mapbg);cursor:grab}
.mapwrap svg{width:100%;height:100%;display:block}
.mapctl{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:3px;z-index:5}
.mapctl button{width:26px;height:26px;border:1px solid var(--line2);background:var(--card);border-radius:6px;cursor:pointer;font-size:14px;line-height:1;padding:0}
.legend{position:absolute;left:8px;bottom:18px;background:var(--card);opacity:.95;border:1px solid var(--line2);border-radius:7px;padding:6px 8px;font-size:10px;color:var(--ink2);z-index:5}
.ramp{display:flex;margin:3px 0 1px}.ramp span{width:20px;height:7px}
.attr{position:absolute;right:4px;bottom:3px;font-size:9px;color:#6b6a66;background:rgba(255,255,255,.75);padding:1px 4px;border-radius:4px;z-index:5}
.tip{position:fixed;pointer-events:none;background:var(--tipbg);color:var(--tiptx);font-size:12px;padding:6px 9px;border-radius:7px;z-index:90;display:none;white-space:nowrap;line-height:1.4}
.tblwrap{position:absolute;inset:0;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-weight:500;color:var(--ink2);font-size:11px;padding:5px 6px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--card)}
th.num,td.num{text-align:right}
td{padding:4px 6px;border-bottom:1px solid var(--grid);white-space:nowrap}
tr:hover td{background:var(--hover)}
.pill{font-size:10px;padding:1px 6px;border-radius:999px;background:var(--hover);color:var(--ink2)}
.minibar{display:inline-block;width:46px;height:5px;border-radius:3px;background:var(--accbg);position:relative;vertical-align:middle;margin-right:6px}
.minibar span{position:absolute;inset:0 auto 0 0;border-radius:3px}
#specPanel{position:fixed;top:0;right:0;bottom:0;width:min(520px,92vw);background:var(--card);border-left:1px solid var(--line2);z-index:80;box-shadow:-10px 0 30px rgba(0,0,0,.15);display:none;flex-direction:column}
#specPanel.open{display:flex}
#specPanel .ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
#specPanel pre{flex:1;margin:0;overflow:auto;font:11.5px/1.5 ui-monospace,Menlo,monospace;padding:12px 14px;background:#1b1b1a;color:#e9e7df}
#log{font-size:12px;color:var(--ink2);padding:8px 14px;border-bottom:1px solid var(--line);max-height:160px;overflow:auto}
#log div{margin:2px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.chips button{border:1px dashed var(--line2);background:transparent;border-radius:999px;padding:3px 10px;font-size:11px;color:var(--ink2);cursor:pointer}
.chips button:hover{border-color:var(--acc);color:var(--acctx)}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px}
@media (max-width:820px){html,body{overflow:auto;height:auto}main{display:flex!important;flex-direction:column}.card{height:280px}.card.kpi{height:96px}.ask{display:none}}
</style>
</head>
<body>
<div id="shell"><div id="app">
<header id="hdr">
  <div class="r1">
    <div class="logo"><i></i>Vima</div>
    <select class="dash" id="dashSel" aria-label="Dashboard"></select>
    <span style="flex:1"></span>
    <button class="ghost icon" id="modeBtn" aria-label="Switch to dark mode" title="Switch to dark mode"></button>
    <button class="ghost" id="undo" title="Undo last change">Undo</button>
    <button class="ghost" id="specBtn">Spec</button>
    <button class="ghost vbtn" id="vimaBtn" title="Open the Vima panel"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg> Vima</button>
    <button class="ghost" id="resetBtn" title="Restore the original demo dashboards">Reset</button>
  </div>
    <div class="r2" id="filters"><div class="meta" id="meta"></div></div>
</header>
<main id="grid"></main>
</div>
<aside id="vima" class="dock" aria-label="Vima assistant">
  <div class="vh"><span class="vt"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Vima</span><span class="vs" id="vSub"></span>
    <button class="ghost icon" id="vMode" title="Float the panel" aria-label="Float the panel"></button><button class="ghost icon" id="vClose" title="Close" aria-label="Close panel">✕</button></div>
  <div class="msgs" id="msgs"></div>
  <div class="scope" id="scope"></div>
  <div class="sugg"><div class="sl" id="suggT">Suggested</div><div id="chips"></div></div>
  <form class="vin" id="ask"><textarea id="askq" rows="2" placeholder="Ask Vima to change this dashboard"></textarea>
    <div class="vrow"><span class="hint2">Enter to send · Shift+Enter for a new line</span><button type="button" class="ghost" id="stopBtn" style="display:none">Stop</button><button id="askBtn" class="send">Send</button></div></form>
</aside>
<button id="launcher" aria-label="Open Vima"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Ask Vima</button>
</div>
<div class="tip" id="tip"></div>
<aside id="specPanel"><div class="ph"><b style="font-size:13px">Dashboard spec</b><span style="font-size:11px;color:var(--mute)">what Claude edits</span><button class="ghost" id="specClose" style="margin-left:auto">Close</button></div><div id="log"></div><pre id="specPre"></pre></aside>

function metric(m,s){
  const fs=s.facs,ts=s.ts;
  switch(m){
    case 'visits':return sum(fs.map(f=>s.w(f)*sum(s.svc.map(k=>sum(ts.map(t=>f.v[k][t]))))));
    case 'visits_per_facility':{const n=fs.filter(f=>ts.some(t=>f.rep[t])).length;return n?metric('visits',s)/n:0}
    case 'facilities':return fs.filter(f=>ts.some(t=>f.rep[t])).length;

function dimCats(dim,s){

    case 'county':n.facs=s.facs.filter(f=>f.c===k);break;case 'region':n.facs=s.facs.filter(f=>f.r===k);break;
    case 'level':n.facs=s.facs.filter(f=>f.l===k);break;case 'ownership':n.facs=s.facs.filter(f=>f.o===k);break;
    case 'age_group':{const w=s.w;n.w=f=>w(f)*f.age[k];break}

const HEX=/^#[0-9a-fA-F]{6}$/;
function validate(s){
  const e=[];if(!s||!Array.isArray(s.widgets))return['spec.widgets must be an array'];
  const g=s.grid||{};if(!(g.cols>=4&&g.cols<=48))e.push('grid.cols must be 4–48');if(!(g.rows>=1&&g.rows<=12))e.push('grid.rows must be 1–12');
  if(s.theme&&s.theme.accent&&!HEX.test(s.theme.accent))e.push('theme.accent must be #rrggbb');
  const ids=new Set();let maps=0;const occ={},stk={};
  s.widgets.forEach(w=>{const p='widget '+(w&&w.id);
    if(!w||!w.id)return e.push('every widget needs an id');if(ids.has(w.id))e.push(p+': duplicate id');ids.add(w.id);
    if(!['kpi','chart','map','table'].includes(w.type))e.push(p+': unknown type '+w.type);
    if(w.type==='map')maps++;
    if(w.type==='chart'&&!CHARTS.includes(w.chart))e.push(p+': unknown chart '+w.chart);
    const needsM=w.type==='kpi'||w.type==='map'||(w.type==='chart'&&w.chart!=='scatter');
    if(needsM&&!METRICS[w.metric])e.push(p+': unknown metric '+w.metric);
    if(w.type==='chart'&&w.chart!=='scatter'){
      if(!DIMS.includes(w.dim))e.push(p+': unknown dim '+w.dim);
      if(w.series&&!DIMS.includes(w.series))e.push(p+': unknown series '+w.series);
      [w.dim,w.series].forEach(d=>{if(d&&DIM_ONLY[d]&&!DIM_ONLY[d].includes(w.metric))e.push(`${p}: dim ${d} only works with ${DIM_ONLY[d].join('/')}`)});
      if(w.chart==='heatmap'&&!w.series)e.push(p+': heatmap needs series');

function applyOps(src,ops){
  const s=clone(src);
  for(const op of ops){
    if(!op||!op.path||!['add','replace','remove'].includes(op.op))throw new Error('bad op '+JSON.stringify(op));
    const parts=op.path.split('/').slice(1).map(p=>p.replace(/~1/g,'/').replace(/~0/g,'~'));
    let o=s;
    for(let i=0;i<parts.length-1;i++){let k=parts[i];
      if(Array.isArray(o)&&!/^\d+$/.test(k)){const j=o.findIndex(x=>x&&x.id===k);if(j<0)throw new Error('no widget '+k);k=j}
      if(o[k]===undefined||o[k]===null){if(op.op==='remove')throw new Error('missing '+op.path);o[k]={}}
      o=o[k]}
    let last=parts[parts.length-1];
    if(Array.isArray(o)){
      if(last==='-'){if(op.op!=='add')throw new Error('- only with add');o.push(op.value);continue}
      if(!/^\d+$/.test(last)){const j=o.findIndex(x=>x&&x.id===last);if(j<0&&op.op!=='add')throw new Error('no widget '+last);last=j<0?o.length:j}
      else last=+last;
      if(op.op==='remove')o.splice(last,1);else if(op.op==='add')o.splice(last,0,op.value);else o[last]=op.value;
    }else{if(op.op==='remove')delete o[last];else o[last]=op.value}
  }
  return s;
}

  grid.style.gridTemplateRows=s.grid.kpi_row?`84px repeat(${s.grid.rows-1},minmax(0,1fr))`:`repeat(${s.grid.rows},minmax(0,1fr))`}
function renderLayout(){

    c.className='card'+(w0.type==='kpi'?' kpi':'');c.style.gridColumn=`${L.x+1} / span ${L.w}`;c.style.gridRow=`${L.y+1} / span ${L.h}`;
    if(w0.type==='kpi'){const st=w0.style||{};const tc=st.title_color?` style="color:${st.title_color}"`:'';c.id='card-'+w0.id;if(st.card_bg)c.style.background=st.card_bg;
      c.innerHTML=`<div class="hd"><div class="lab"${tc}>${esc(w0.title||'')}</div><span class="wid">${w0.id}</span><button class="askw" data-w="${w0.id}" title="Ask Vima about this card" aria-label="Ask Vima about this card"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></button></div><div class="val"${tc}>–</div><div class="row"><div class="d"></div><div class="spark"></div></div>`;
      c.querySelector('.askw').onclick=e=>{e.stopPropagation();openScope(w0.id)};sl.active=0;grid.appendChild(c);return}
    c.innerHTML=`<div class="hd"><h3></h3><span class="sub"></span><span class="wid"></span><button class="askw" title="Ask Vima about this chart" aria-label="Ask Vima about this chart"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg></button></div><div class="body"></div>${sl.ws.length>1?'<div class="tabs" role="tablist"></div>':''}`;
    c.querySelector('.askw').onclick=e=>{e.stopPropagation();openScope(sl.ws[sl.active].id)};const body=c.querySelector('.body');
    sl.ws.forEach(w=>{const p=document.createElement('div');p.className='pane';p.id='pane-'+w.id;body.appendChild(p)});
    if(sl.ws.length>1){const t=c.querySelector('.tabs');
      const fade=()=>{t.classList.toggle('more-l',t.scrollLeft>2);t.classList.toggle('more-r',t.scrollLeft+t.clientWidth<t.scrollWidth-2)};t.addEventListener('scroll',fade);t.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&t.scrollWidth>t.clientWidth){t.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});sl.fade=fade;
      sl.ws.forEach((w,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.textContent=w.tab||w.title||w.id;b.title=(w.title||'')+' ('+w.id+')';b.onclick=()=>activate(k,i);t.appendChild(b)})}
    sl.active=Math.min(act[k]||0,sl.ws.length-1);
    grid.appendChild(c);
    sl.ws.forEach(w=>{if(w.type==='map'){const p=document.getElementById('pane-'+w.id);p.classList.add('on');buildMap(p,w)}});
    showSlot(k)});
  document.title='Vima · '+s.title;renderData();drawSpec();markScope();
}
function showSlot(k){const sl=SLOTS.get(k),c=sl.card,w=sl.ws[sl.active],st=w.style||{};
  c.id='card-'+w.id;c.style.background=st.card_bg||'';
  const h=c.querySelector('h3');h.textContent=w.title||'';h.style.color=st.title_color||'';
  c.querySelector('.sub').textContent=w.subtitle||'';c.querySelector('.wid').textContent=sl.ws.length>1?`${w.id} · ${sl.active+1}/${sl.ws.length}`:w.id;
  sl.ws.forEach((x,i)=>document.getElementById('pane-'+x.id).classList.toggle('on',i===sl.active));
  c.querySelectorAll('.tabs button').forEach((b,i)=>{b.classList.toggle('on',i===sl.active);b.setAttribute('aria-selected',i===sl.active);if(i===sl.active){const t=b.parentNode;const l=b.offsetLeft-t.offsetLeft;if(l<t.scrollLeft)t.scrollLeft=l-8;else if(l+b.offsetWidth>t.scrollLeft+t.clientWidth)t.scrollLeft=l+b.offsetWidth-t.clientWidth+8}});sl.fade&&requestAnimationFrame(sl.fade);
}
function activate(k,i){const sl=SLOTS.get(k);if(!sl||sl.active===i)return;sl.active=i;const s=spec();(ACT[s.id]=ACT[s.id]||{})[k]=i;store.set('vima.act',ACT);
  showSlot(k);const w=sl.ws[i];renderWidget(w);if(w.type==='map'&&MAP.fit)requestAnimationFrame(()=>MAP.fit(false));const c=CH[w.id];c&&c.resize()}
function activateWidget(id){for(const [k,sl] of SLOTS){const i=sl.ws.findIndex(w=>w.id===id);if(i>=0){activate(k,i);return sl.card}}}
function renderWidget(w){
  if(w.type==='kpi'){const c=document.getElementById('card-'+w.id);return c&&drawKpi(c,w)}
  const b=document.getElementById('pane-'+w.id);if(!b)return;
  try{
    if(w.type==='map')return MAP.draw&&MAP.draw(w);
    if(w.type==='table')return drawTable(b,w);
    if(w.chart==='scatter')return ec(b,w.id,scatterOpt(w));

    if(!R.cats.length){CH[w.id]&&(CH[w.id].dispose(),delete CH[w.id]);b.innerHTML='<div class="empty">No data for current filters</div>';return}
    const em=b.querySelector('.empty');if(em)em.remove();
    const fk=FILTER_OF[w.dim];
    ec(b,w.id,chartOpt(w,R),fk&&!w.series?p=>{const c=R.cats.find(x=>x.l===p.name);if(c)toggle(fk,fval(w.dim,c))}:fk&&w.chart==='heatmap'?p=>{const ys=R.cats.map(c=>c.l).reverse();const c=R.cats.find(x=>x.l===ys[p.value[1]]);if(c)toggle(fk,fval(w.dim,c))}:null);
  }catch(err){b.innerHTML='<div class="empty">Could not draw: '+esc(err.message)+'</div>'}
}

  document.getElementById('meta').textContent=`${rows().length}/${F.length} facilities · ${s.widgets.length} widgets in ${SLOTS.size} slots${stacked?` (${stacked} stacked)`:''} · v${s.version} · demo data`;

addEventListener('resize',()=>{fitGrid()});

/* ===== dashboard switcher, spec panel, undo ===== */
const dashSel=document.getElementById('dashSel');
function fillDash(){dashSel.innerHTML=SPECS.map(s=>`<option value="${s.id}" ${s.id===activeId?'selected':''}>${esc(s.title)}</option>`).join('')}
dashSel.onchange=()=>{activeId=dashSel.value;SCOPE=null;saveSpecs();renderLayout();drawScope();drawChips()};
function drawSpec(){document.getElementById('specPre').textContent=JSON.stringify(spec(),null,2);
  document.getElementById('log').innerHTML=(LOG[activeId]||[]).length?(LOG[activeId]).map(l=>`<div>v${l.v}: ${esc(l.t)}</div>`).join(''):'<div>No edits yet. Ask Vima for a change and each patch is listed here.</div>'}
document.getElementById('modeBtn').onclick=()=>{const curM=document.documentElement.dataset.mode;VIEW_MODE=curM==='dark'?'light':'dark';store.set('vima.viewMode',VIEW_MODE);renderLayout()};
document.getElementById('specBtn').onclick=e=>{e.stopPropagation();document.getElementById('specPanel').classList.toggle('open')};
document.getElementById('specClose').onclick=()=>document.getElementById('specPanel').classList.remove('open');
document.getElementById('undo').onclick=()=>{const h=HIST[activeId];if(!h||!h.length)return setStatus('Nothing to undo.','ok');
  const i=SPECS.findIndex(s=>s.id===activeId);SPECS[i]=h.pop();(LOG[activeId]||[]).pop();saveSpecs();fillDash();renderLayout();setStatus('Undid the last change.','ok')};
document.getElementById('resetBtn').onclick=()=>{SPECS=clone(SPECS0);for(const k in HIST)delete HIST[k];for(const k in LOG)delete LOG[k];if(!SPECS.find(s=>s.id===activeId))activeId=SPECS[0].id;saveSpecs();fillDash();renderLayout();drawChips();setStatus('Demo dashboards restored.','ok')};

/* ===== Ask Vima → Claude → patch → validate → render ===== */
const stopBtn=document.getElementById('stopBtn'),msgs=document.getElementById('msgs'),vima=document.getElementById('vima'),launcher=document.getElementById('launcher');
let thinkEl=null;
function addMsg(cls,html){const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
function setStatus(t,kind){
  if(kind===''){if(!thinkEl)thinkEl=addMsg('a think','<i></i><span></span>');thinkEl.querySelector('span').textContent=t;msgs.scrollTop=msgs.scrollHeight;return}
  if(thinkEl){thinkEl.remove();thinkEl=null}
  addMsg('a'+(kind==='err'?' err':kind==='info'?' info':''),esc(t));if(!vima.classList.contains('open')&&kind!=='info')openPanel()}
/* panel: dock or float, open or closed */
let PANEL=store.get('vima.panel')||{open:innerWidth>820,mode:'dock'};
const DOCK_I='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>';
const FLOAT_I='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="12" y="11" width="7" height="7" rx="1"/></svg>';
function applyPanel(){vima.classList.toggle('open',PANEL.open);vima.classList.toggle('dock',PANEL.mode==='dock');vima.classList.toggle('float',PANEL.mode==='float');
  launcher.classList.toggle('on',!PANEL.open);document.getElementById('vimaBtn').classList.toggle('on',PANEL.open);
  const vm=document.getElementById('vMode');vm.innerHTML=PANEL.mode==='dock'?FLOAT_I:DOCK_I;const l=PANEL.mode==='dock'?'Float the panel':'Dock the panel to the side';vm.title=l;vm.setAttribute('aria-label',l);
  store.set('vima.panel',PANEL);requestAnimationFrame(()=>{fitGrid();for(const k in CH)CH[k].resize();MAP.fit&&MAP.fit(false)})}
function openPanel(){PANEL.open=true;applyPanel();document.getElementById('askq').focus()}
document.getElementById('vimaBtn').onclick=()=>{PANEL.open=!PANEL.open;applyPanel()};
launcher.onclick=openPanel;document.getElementById('vClose').onclick=()=>{PANEL.open=false;applyPanel()};
document.getElementById('vMode').onclick=()=>{PANEL.mode=PANEL.mode==='dock'?'float':'dock';applyPanel()};
/* scope: ask about one chart */
let SCOPE=null;
const wById=id=>spec().widgets.find(w=>w.id===id);
function openScope(id){SCOPE=id;openPanel();drawScope();drawChips();markScope()}
function clearScope(){SCOPE=null;drawScope();drawChips();markScope()}
function markScope(){document.querySelectorAll('.card.scoped').forEach(c=>c.classList.remove('scoped'));if(SCOPE){const c=document.getElementById('card-'+SCOPE);c&&c.classList.add('scoped')}}
function drawScope(){const el=document.getElementById('scope'),w=SCOPE&&wById(SCOPE);if(SCOPE&&!w)SCOPE=null;
  el.classList.toggle('on',!!w);el.innerHTML=w?`Editing <b>${esc(w.id)}</b> · ${esc(w.title||'')}<button type="button" title="Back to whole dashboard" aria-label="Clear chart scope">✕</button>`:'';
  if(w)el.querySelector('button').onclick=clearScope;
  document.getElementById('askq').placeholder=w?`Ask Vima to change “${w.title||w.id}”`:'Ask Vima to change this dashboard';
  document.getElementById('vSub').textContent=w?'chart '+w.id:spec().title;document.getElementById('suggT').textContent=w?'Suggested for this chart':'Suggested for this dashboard'}
const EXAMPLES={'facility-performance':['Make the reporting rate chart orange with a target of 85%','Remove the map and let the trend chart take its space','Switch to dark mode','Change w09 into a donut of the top 6 counties','Colour OPD dark green everywhere'],
 'programme-40':['Add a chart of referrals in by county to the map slot','Bring the stock-out watchlist to the front and colour it purple','Use a teal accent across the dashboard','Add a heatmap of ANC4 coverage by region and month behind w12'],
 'service-delivery':['Add a map of visits by county on the right','Make the service mix a bar chart sorted by visits','Use a teal palette for the stock-out chart','Make the KPI cards purple']};
function chartSuggestions(w){const t=w.type,c=w.chart,out=[];
  if(t==='kpi')return['Make this card green','Hide the sparkline','Show ANC4 coverage here instead','Use a dark card background'];
  if(t==='map')return['Use a red colour ramp','Hide the facility points','Show reporting rate per county instead','Make facility points purple','Turn off the basemap'];
  if(t==='table')return['Add a region column','Sort by reporting rate','Show only the top 10','Colour the bars orange'];
  if(['bar','hbar'].includes(c))out.push(c==='bar'?'Make it horizontal':'Make it vertical','Switch to a donut','Show only the top 5');
  if(['line','area'].includes(c))out.push(c==='line'?'Fill it as an area chart':'Make it a line chart','Add a target line at 80%','Show data markers');
  if(c==='donut'||c==='pie')out.push('Make it a horizontal bar chart','Hide the percentage labels');
  if(c==='heatmap')out.push('Use a green colour ramp','Show the top 5 rows only');
  if(!w.series&&!['heatmap','pyramid','scatter'].includes(c))out.push('Split it by region');
  out.push('Change the colour to purple','Add another chart behind this one');return out.slice(0,6)}
function drawChips(){const c=document.getElementById('chips'),w=SCOPE&&wById(SCOPE);const list=w?chartSuggestions(w):(EXAMPLES[activeId]||[]);
  c.innerHTML=list.map(t=>`<button type="button">${esc(t)}</button>`).join('');
  c.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.getElementById('askq').value=b.textContent;ask()})}
document.getElementById('askq').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
const CATALOG={
 widget_types:{kpi:'one metric, change vs previous period, 12-month sparkline. fields: metric, sparkline(bool), style.color',
  chart:'fields: chart, metric, dim, series(optional second dim), top(n), sort(desc|asc|none), style',
  map:'Kenya county choropleth + facility points over a basemap. fields: metric, style.ramp, style.point_color, style.basemap/choropleth/points (bools), style.opacity. Max one per dashboard. Optional, never required.',
  table:'facility table. fields: columns (facility,county,region,level,ownership or any metric), sort_by, top'},
 charts:{bar:'vertical bars',hbar:'horizontal bars',line:'lines',area:'filled lines',donut:'ring, no series',pie:'no series',heatmap:'needs series; rows=dim, columns=series',pyramid:'only dim age_group + series sex',scatter:'facility staff vs monthly visits, no metric/dim'},
 metrics:Object.fromEntries(Object.entries(METRICS).map(([k,v])=>[k,v.label+(v.fmt==='pct'?' (%)':'')])),
 dims:DIMS,dim_restrictions:DIM_ONLY,
 style_keys:{color:'#hex single-series/kpi colour',colors:'{label:#hex} per category or series, e.g. {"OPD":"#0f6e56"}',palette:'cove|blues|greens|oranges|purples|reds|teals or array of #hex',ramp:'heatmap/map ramp name',labels:'bool',legend:'bool',smooth:'bool',stack:'bool',markers:'bool',target:'number reference line',bar_radius:'number',bar_width:'number',line_width:'number',y_min:'number',card_bg:'#hex card background',title_color:'#hex'},
 theme:{mode:'light|dark',accent:'#hex'},
 grid:'grid.cols columns x grid.rows rows. If grid.kpi_row is true, row 0 is a short fixed-height row for kpi widgets only (h=1); all other rows share the remaining screen height equally. The whole dashboard always fits one screen with no scrolling. Stacks: widgets with exactly the same layout share one slot; the card shows one at a time with name tabs below it to switch (kpis cannot stack; max 8 per slot; optional short tab label in widget.tab). When the grid is full or the user asks for more charts, add the new widget to an existing slot (copy that slot\'s layout) instead of shrinking others. Removing a widget from a stack needs no re-flow.'};
function prompt(s,req,errs,prevOut,scope){
  return `You are the dashboard editor inside Vima, an AI BI app. Edit the dashboard SPEC below to fulfil the USER REQUEST.

Reply with ONLY a JSON object: {"summary":"<one short sentence, past tense, what you changed>","ops":[...]}.
ops use JSON-Patch: {"op":"replace"|"add"|"remove","path":"...","value":...}. Address widgets by id, not index:
/widgets/w10/style/color, /widgets/w10/chart, /widgets/w10/layout, /widgets/w07 (remove a widget), /widgets/- (add a widget), /theme/mode, /title. When you set a nested key whose parent may not exist (e.g. style), "add" or "replace" on the full path is fine.

Rules:
- Make the smallest change that does what was asked. Do not touch other widgets unless the layout needs it.
- The dashboard must fit one screen: every layout {x,y,w,h} must be inside the grid, widgets must not overlap, and the grid should stay filled. When you remove or add a widget, re-flow the neighbouring widgets' layouts (or change grid.rows) so no large empty holes remain.
- Only use widget types, charts, metrics, dims and style keys from the CATALOG. Colours are #rrggbb.
- If a request names a widget by title or id, edit only that widget. "Everywhere" means every widget it applies to.
- New widget ids: next free id with the same prefix (e.g. w21, s11).
- If the request cannot be done with the catalog, return "ops":[] and say why in summary.

CATALOG:
${JSON.stringify(CATALOG)}

SPEC:
${JSON.stringify(s)}

USER REQUEST: ${req}${scope?`

SCOPE: the user asked this from widget ${scope} ("${(s.widgets.find(w=>w.id===scope)||{}).title||''}"). Words like "this", "it" or "here" mean that widget. Only change other widgets if the request clearly asks for it or the layout needs it.`:''}${errs?`

Your previous reply was:
${prevOut}

Applying it to the SPEC above failed validation:
- ${errs.join('\n- ')}
Return a corrected full reply (ops relative to the SPEC above).`:''}`;
}
let sampleFn=null,ctl=null;
(async()=>{try{sampleFn=window.claude?await claude.use('sample'):null}catch(e){sampleFn=null}
  if(!sampleFn)setStatus('Live editing needs this page open on claude.ai, where I can ask Claude. Filters, cross-filtering, chart tabs, undo and the spec panel work everywhere.','info')})();
stopBtn.onclick=()=>ctl&&ctl.abort();
document.getElementById('ask').onsubmit=e=>{e.preventDefault();ask()};
async function ask(){
  const q=document.getElementById('askq').value.trim();if(!q)return setStatus('Type a change first, e.g. “make the trend chart a bar chart”.','err');
  if(!sampleFn){addMsg('u',esc(q));document.getElementById('askq').value='';return setStatus('Live editing needs this page open on claude.ai, where Vima can ask Claude.','err')}
  const s0=spec(),btn=document.getElementById('askBtn'),scopeAt=SCOPE;btn.disabled=true;stopBtn.style.display='';
  addMsg('u',esc(q)+(scopeAt?`<div class="tag" style="color:inherit;opacity:.7">on ${esc(scopeAt)}</div>`:''));document.getElementById('askq').value='';
  let errs=null,out=null,next=null,res=null;
  try{
    for(let attempt=0;attempt<2;attempt++){
      ctl=new AbortController();setStatus(attempt?'Fixing the patch so it passes validation…':'Vima is asking Claude for a patch…','');
      res=await sampleFn.json(prompt(s0,q,errs,out,scopeAt),{signal:ctl.signal,cache:false,modelTier:'default'});
      out=JSON.stringify(res);
      if(!res||!Array.isArray(res.ops))throw{code:'shape',message:'Claude did not return ops'};
      if(!res.ops.length){setStatus('No change: '+(res.summary||'the request could not be done with this catalog.'),'err');return}
      try{next=applyOps(s0,res.ops);errs=validate(next)}catch(x){errs=[x.message];next=null}
      if(!errs.length)break;
    }
    if(errs.length){setStatus('Claude’s patch did not pass validation, so nothing changed: '+errs.slice(0,2).join('; '),'err');return}
    if(JSON.stringify(next.theme)!==JSON.stringify(s0.theme)){VIEW_MODE=null;store.set('vima.viewMode',null)}next.version=(s0.version||1)+1;(HIST[activeId]=HIST[activeId]||[]).push(clone(s0));(LOG[activeId]=LOG[activeId]||[]).push({v:next.version,t:res.summary||q});
    const i=SPECS.findIndex(s=>s.id===activeId);SPECS[i]=next;saveSpecs();fillDash();renderLayout();
    touched(res.ops).forEach(id=>{const c=activateWidget(id)||document.getElementById('card-'+id);if(c){c.classList.add('flash');setTimeout(()=>c.classList.remove('flash'),2200)}});
    if(thinkEl){thinkEl.remove();thinkEl=null}addMsg('a',esc(res.summary||'Updated.')+`<div class="tag">v${next.version} · ${res.ops.length} op${res.ops.length>1?'s':''} · ${touched(res.ops).join(', ')}</div>`);drawScope();drawChips();
  }catch(e){const c=e&&e.code;
    setStatus(c==='cancelled'?'Stopped. Nothing changed.':c==='not_granted'||c==='sampling_disabled'?'Claude access was not allowed for this page, so live editing is off.':c==='rate_limited'?'Too many requests just now. Try again in a moment.':c==='invalid_json'?'Claude’s reply was not valid JSON. Try again or rephrase.':'Could not get a patch ('+(e&&e.message||c||'error')+'). Nothing changed.','err');
    if(c==='not_granted'||c==='sampling_disabled')sampleFn=null;
  }finally{btn.disabled=false;stopBtn.style.display='none';ctl=null}
}

readTheme();fillDash();applyPanel();addMsg('a','Hi, I’m Vima. Tell me what to change on this dashboard, or click <b>✦</b> on any chart to work on just that chart.');renderLayout();drawScope();drawChips();
</script>
